[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "economic-engine"
version = "0.1.0"
description = "Autonomous negotiation engine — backend-only, ultra-low-latency negotiation API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
faiss = ["faiss-cpu>=1.8"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
